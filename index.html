<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>btk-demo</title>
    <style>
      /* Temel reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        line-height: 1.5;
      }

      /* Tüm içerik ekranın genişliğine uyumlu */
      #root {
        width: 100%;
        padding: 1rem;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Flex ve kolonlar */
      .flex {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .col {
        flex: 1 1 100%;
      }

      @media (min-width: 768px) {
        .col-md-6 {
          flex: 1 1 48%;
        }
        .col-md-4 {
          flex: 1 1 30%;
        }
      }

      /* Başlık ve metin */
      h1, h2, h3 {
        margin-bottom: 1rem;
      }

      p {
        margin-bottom: 1rem;
      }

      img, iframe, video {
        max-width: 100%;
        height: auto;
      }

      .btn {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        text-align: center;
        transition: background 0.3s;
      }

      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
